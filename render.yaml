# Render Blueprint for the hosted development deployment of Web Walking
# Skeleton 01. See web/README.md ("Hosted development deployment") for the
# full topology rationale: one Node web service serves both the Express
# API and the built React SPA from a single origin (server-side sessions,
# simplest cookie/CORS story - see docs/product/version2/
# Web_Product_Foundation_v1.md Section 9's "Frontend / backend URL wiring"
# requirement), backed by one Render PostgreSQL database.
#
# This is a development deployment, not production: EMAIL_PROVIDER is
# "console" (the magic link is read from Render's Logs tab, not emailed),
# and both resources default to Render's free plan. NODE_ENV=production
# below is the standard Node.js convention (enables secure cookies and
# disables Express's dev error pages) - it does not mean this is a
# production release of the product.
#
# No secret value is present in this file. OPENAI_API_KEY is `sync:
# false` - the Repository Author enters it directly in the Render
# dashboard. SESSION_SECRET is generated by Render itself.

databases:
  - name: ramrattan-studio-db
    plan: free
    region: oregon
    databaseName: ramrattan_studio
    user: ramrattan

services:
  - name: ramrattan-studio
    type: web
    runtime: node
    plan: free
    region: oregon
    rootDir: web
    buildCommand: npm install && npm run build
    startCommand: npm run start --workspace server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ramrattan-studio-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: EMAIL_PROVIDER
        value: console
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: CLIENT_ORIGIN
        value: https://ramrattan-studio.onrender.com
